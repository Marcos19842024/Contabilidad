name: Compilar y publicar Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Compilar en ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            nombre_artefacto: build-windows
            comando_compilar: pyinstaller --onedir --windowed --name SistemaIngresos --clean --noconfirm --add-data "catalogo_qvet.json;." --add-data "MANUAL.md;." --hidden-import ttkbootstrap --hidden-import PIL --hidden-import pdfminer --hidden-import pdfplumber --collect-all cfdiclient --hidden-import cryptography --hidden-import OpenSSL --collect-all lxml --hidden-import Crypto --hidden-import requests --hidden-import urllib3 --exclude-module matplotlib --exclude-module numpy --exclude-module pandas --exclude-module scipy main.py
            ruta_dist: dist/SistemaIngresos

          - os: macos-latest
            nombre_artefacto: build-macos
            comando_compilar: pyinstaller --onedir --windowed --name SistemaIngresos --clean --noconfirm --add-data "catalogo_qvet.json:." --add-data "MANUAL.md:." --hidden-import ttkbootstrap --hidden-import PIL --hidden-import pdfminer --hidden-import pdfplumber --collect-all cfdiclient --hidden-import cryptography --hidden-import OpenSSL --collect-all lxml --hidden-import Crypto --hidden-import requests --hidden-import urllib3 --exclude-module matplotlib --exclude-module numpy --exclude-module pandas --exclude-module scipy main.py
            ruta_dist: dist/SistemaIngresos.app

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - run: ${{ matrix.comando_compilar }}

      # macOS: generar ícono y crear .app
      - name: 🎨 Generar ícono
        if: matrix.os == 'macos-latest'
        run: python generar_icono.py

      - name: 📱 Crear .app
        if: matrix.os == 'macos-latest'
        run: |
          chmod +x crear_app_mac.sh
          ./crear_app_mac.sh

      # macOS: comprimir
      - name: 🗜️ Comprimir (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent "Sistema Ingresos.app" "Sistema Ingresos ${{ github.ref_name }} - macOS.zip"

      # Windows: comprimir
      - name: 🗜️ Comprimir (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cd dist
          Compress-Archive -Path "SistemaIngresos" -DestinationPath "Sistema Ingresos ${{ github.ref_name }} - Windows.zip"
        shell: pwsh

      # Subir como artefacto temporal (NO crea el Release aún)
      - name: 📤 Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.nombre_artefacto }}
          path: dist/*.zip
          retention-days: 1

  # ============================================================
  # JOB SEPARADO: Crear el Release con ambos archivos
  # ============================================================
  release:
    name: Publicar Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Descargar todos los artefactos
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 📋 Listar archivos descargados
        run: ls -la artifacts/

      - name: 🚀 Crear Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          name: Sistema Ingresos ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false