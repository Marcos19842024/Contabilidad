# ============================================================
# .github/workflows/build.yml
# Compila SistemaIngresos para Windows y macOS automáticamente
# ============================================================

name: Compilar SistemaIngresos

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:   # permite ejecutarlo manualmente desde GitHub

jobs:
  build:
    name: Compilar en ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            nombre_artefacto: SistemaIngresos-Windows
            comando_compilar: pyinstaller --onedir --windowed --name SistemaIngresos --clean --noconfirm --add-data "catalogo_qvet.json;." --hidden-import ttkbootstrap --hidden-import PIL --hidden-import pdfminer --hidden-import pdfplumber --exclude-module matplotlib --exclude-module numpy --exclude-module pandas --exclude-module scipy Ingresos.py
            ruta_dist: dist/SistemaIngresos

          - os: macos-latest
            nombre_artefacto: SistemaIngresos-macOS
            comando_compilar: pyinstaller --onedir --windowed --name SistemaIngresos --clean --noconfirm --add-data "catalogo_qvet.json:." --hidden-import ttkbootstrap --hidden-import PIL --hidden-import pdfminer --hidden-import pdfplumber --exclude-module matplotlib --exclude-module numpy --exclude-module pandas --exclude-module scipy Ingresos.py
            ruta_dist: dist/SistemaIngresos

    steps:
      # 1. Descargar el código del repo
      - name: 📥 Descargar código
        uses: actions/checkout@v4

      # 2. Instalar Python
      - name: 🐍 Instalar Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # 3. Instalar dependencias
      - name: 📦 Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Compilar con PyInstaller
      - name: 🔨 Compilar con PyInstaller
        run: ${{ matrix.comando_compilar }}

      # 5. Mostrar qué se generó (debug)
      - name: 🔍 Listar archivos generados
        run: |
          echo "Contenido de dist/:"
          ls -la dist/ || dir dist\
        shell: bash

      # 6. Subir el resultado como artefacto descargable
      - name: 📤 Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.nombre_artefacto }}
          path: ${{ matrix.ruta_dist }}/
          retention-days: 30