name: Compilar SistemaIngresos

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Compilar en ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            nombre_artefacto: SistemaIngresos-Windows
            comando_compilar: pyinstaller --onedir --windowed --name SistemaIngresos --clean --noconfirm --add-data "catalogo_qvet.json;." --hidden-import ttkbootstrap --hidden-import PIL --hidden-import pdfminer --hidden-import pdfplumber --exclude-module matplotlib --exclude-module numpy --exclude-module pandas --exclude-module scipy main.py
            ruta_dist: dist/SistemaIngresos

          - os: macos-latest
            nombre_artefacto: SistemaIngresos-macOS
            comando_compilar: pyinstaller --onedir --windowed --name SistemaIngresos --clean --noconfirm --add-data "catalogo_qvet.json:." --hidden-import ttkbootstrap --hidden-import PIL --hidden-import pdfminer --hidden-import pdfplumber --exclude-module matplotlib --exclude-module numpy --exclude-module pandas --exclude-module scipy main.py
            ruta_dist: dist/Sistema Ingresos.app

    steps:
      - name: 📥 Descargar código
        uses: actions/checkout@v4

      - name: 🐍 Instalar Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 📦 Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🔨 Compilar con PyInstaller
        run: ${{ matrix.comando_compilar }}

      - name: 🎨 Generar ícono
        if: matrix.os == 'macos-latest'
        run: python generar_icono.py

      - name: 📱 Crear .app
        if: matrix.os == 'macos-latest'
        run: |
          chmod +x crear_app_mac.sh
          ./crear_app_mac.sh

      - name: ✅ Verificar .app
        if: matrix.os == 'macos-latest'
        run: |
          echo "=== Estructura ==="
          ls -la "dist/Sistema Ingresos.app/Contents/"
          echo ""
          echo "=== Info.plist ==="
          plutil -lint "dist/Sistema Ingresos.app/Contents/Info.plist" || true
        shell: bash

      - name: 📤 Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.nombre_artefacto }}
          path: ${{ matrix.ruta_dist }}
          retention-days: 30