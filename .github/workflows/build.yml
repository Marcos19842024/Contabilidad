name: Compilar SistemaIngresos

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Compilar en ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            nombre_artefacto: SistemaIngresos-Windows
            comando_compilar: pyinstaller --onedir --windowed --name SistemaIngresos --clean --noconfirm --add-data "catalogo_qvet.json;." --hidden-import ttkbootstrap --hidden-import PIL --hidden-import pdfminer --hidden-import pdfplumber --exclude-module matplotlib --exclude-module numpy --exclude-module pandas --exclude-module scipy main.py
            ruta_dist: dist/SistemaIngresos

          - os: macos-latest
            nombre_artefacto: SistemaIngresos-macOS
            comando_compilar: pyinstaller --onedir --windowed --name SistemaIngresos --clean --noconfirm --add-data "catalogo_qvet.json:." --hidden-import ttkbootstrap --hidden-import PIL --hidden-import pdfminer --hidden-import pdfplumber --exclude-module matplotlib --exclude-module numpy --exclude-module pandas --exclude-module scipy main.py
            ruta_dist: dist/SistemaIngresos

    steps:
      # 1. Descargar el código
      - name: 📥 Descargar código
        uses: actions/checkout@v4

      # 2. Instalar Python
      - name: 🐍 Instalar Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # 3. Instalar dependencias
      - name: 📦 Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Compilar con PyInstaller
      - name: 🔨 Compilar con PyInstaller
        run: ${{ matrix.comando_compilar }}

      # 5. Re-firmar binarios (SOLO macOS)
      - name: 🔏 Re-firmar binarios (solo macOS)
        if: matrix.os == 'macos-latest'
        run: |
          cd dist/SistemaIngresos
          echo "Re-firmando archivos Python..."
          find _internal -type f \( -name "*.so" -o -name "*.dylib" -o -name "Python" \) -exec codesign --force --sign - {} \; 2>/dev/null || true
          echo "Re-firmando frameworks..."
          find _internal -type d -name "*.framework" -exec codesign --force --deep --sign - {} \; 2>/dev/null || true
          echo "Re-firmando ejecutable principal..."
          codesign --force --sign - SistemaIngresos 2>/dev/null || true
          echo "Verificando firmas..."
          codesign -dv _internal/Python.framework 2>&1 | head -3 || true

      # 6. Listar archivos generados
      - name: 🔍 Listar archivos generados
        run: |
          echo "Contenido de dist/:"
          ls -la dist/ || dir dist\
        shell: bash

      # 7. Subir el artefacto
      - name: 📤 Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.nombre_artefacto }}
          path: ${{ matrix.ruta_dist }}/
          retention-days: 30